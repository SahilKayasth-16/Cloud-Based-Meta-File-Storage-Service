    <title>Stack with class</title>

<body>

</body>
<script>
    class Stack {
        item = [];
        currentSize;
        maxSize;
        constructor(size) {
            this.maxSize = size;
            this.currentSize = this.item.length;
        }
        push(newEle) {
            if (this.currentSize >= this.maxSize) {
                console.log("Stack is full");
            } else {
                this.item[this.currentSize] = newEle;
                this.currentSize++;
            }
        }
        pop() { 
            if (this.currentSize >= 0) {
                this.currentSize--;
                this.item.length = this.currentSize;
            } else {
                console.log("Stack is already empty.")
            }
        }
        display() { 
            console.log(this.item);
        }
    }

    st1 = new Stack(10);
</script>

</html>
