spring.application.name=cloud-meta-storage

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/cloud_meta_storage
spring.datasource.username=postgres
spring.datasource.password=S@hil906q

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server
server.port=8080

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration=${JWT_EXPIRATION:86400000}

# Storage Provider Configuration (local or s3)
storage.provider=${STORAGE_PROVIDER:local}

# S3 / Object Storage Configuration
aws.s3.access-key=${AWS_ACCESS_KEY_ID:minioadmin}
aws.s3.secret-key=${AWS_SECRET_ACCESS_KEY:minioadmin}
aws.s3.region=${AWS_REGION:us-east-1}
aws.s3.bucket-name=${AWS_S3_BUCKET_NAME:cloud-meta-storage}
aws.s3.endpoint=${AWS_S3_ENDPOINT:}
aws.s3.path-style-access-enabled=${AWS_S3_PATH_STYLE_ACCESS:true}

# Multipart Upload Limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB